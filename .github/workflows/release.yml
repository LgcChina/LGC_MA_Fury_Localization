# LGC_VRCMAFury_中文拓展 release workflow v2.3.6
name: Publish VPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v2.3.6'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build VPM artifacts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.zip dist/package.json dist/SHA256SUMS.txt
          --verify-tag
          --title "LGC_VRCMAFury_中文拓展 ${RELEASE_TAG#v}"
          --notes-file RELEASE_NOTES.md